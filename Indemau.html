<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>विस्तृत जानकारी एवं संसाधन - जनशक्ति</title>

    <style>
        :root {
            --navy: #06142a;
            --navy-2: #0a2236;
            --gold: #f3c14f;
            --gold-2: #d9a62e;
            --muted: #9fb8b2;
            --line: rgba(243, 193, 79, .28);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Noto Sans Devanagari", "Segoe UI", Arial, sans-serif;
            color: #eaf2f0;
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 80px;
            background:
                radial-gradient(900px 500px at 85% -10%, rgba(15, 90, 70, .55), transparent 60%),
                radial-gradient(700px 500px at -10% 40%, rgba(243, 193, 79, .08), transparent 60%),
                linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 55%, #08241f 100%);
            background-attachment: fixed;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Top Bar */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(6, 20, 42, .9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            min-height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 5%;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            color: #ffffff;
            font-size: 24px;
            font-weight: 800;
            line-height: 1.1;
        }

        .brand small {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--gold);
        }

        /* Close Button */
        .close-btn {
            color: var(--gold);
            background: transparent;
            border: 1.5px solid var(--gold);
            border-radius: 999px;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: .2s ease;
        }

        .close-btn:hover,
        .close-btn:focus-visible {
            background: var(--gold);
            color: var(--navy);
            outline: none;
        }

        /* Container */
        .container {
            width: min(850px, 92%);
            margin: 30px auto 50px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        /* Header */
        .page-header {
            text-align: center;
            padding: 6px 8px 4px;
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 800;
            line-height: 1.35;
            color: #fff;
            margin-bottom: 8px;
        }

        .page-header p {
            font-size: 14.5px;
            color: var(--muted);
        }

        /* Content Card */
        .content-card {
            position: relative;
            border-radius: 20px;
            padding: 20px 18px 22px;
            background: linear-gradient(160deg, rgba(15, 90, 70, .50), rgba(8, 36, 31, .78));
            border: 1px solid var(--line);
            box-shadow: 0 14px 34px rgba(0, 0, 0, .35),
                inset 0 1px 0 rgba(255, 255, 255, .06);
        }

        .content-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 18px;
            bottom: 18px;
            width: 4px;
            border-radius: 0 4px 4px 0;
            background: linear-gradient(180deg, var(--gold), var(--gold-2));
        }

        .content-card h2 {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 14px;
            padding-left: 10px;
        }

        /* Video */
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(243, 193, 79, .35);
            box-shadow: 0 10px 26px rgba(0, 0, 0, .45);
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        .video-soon {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
            padding: 16px;
            color: var(--gold);
            font-size: 19px;
            font-weight: 700;
            background: linear-gradient(160deg, #0b2a2f, #06142a);
        }

        .video-soon small {
            color: var(--muted);
            font-size: 13px;
            font-weight: 400;
        }

        /* Download */
        .download-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: rgba(6, 20, 42, .55);
            padding: 16px 18px;
            border-radius: 14px;
            border: 1.5px dashed rgba(243, 193, 79, .55);
        }

        .download-action span {
            font-size: 14.5px;
            color: #d6e6e2;
            font-weight: 500;
        }

        .download-btn {
            background: linear-gradient(180deg, #ffd978, var(--gold-2));
            color: #1d1503;
            padding: 11px 20px;
            font-size: 14.5px;
            font-weight: 700;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 8px 18px rgba(217, 166, 46, .28);
            transition: transform .15s, box-shadow .15s;
        }

        .download-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 22px rgba(217, 166, 46, .38);
        }

        .download-btn:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 2px;
        }

        .download-btn.soon {
            background: rgba(255, 255, 255, .08);
            color: var(--muted);
            border: 1px solid rgba(255, 255, 255, .14);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
            pointer-events: none;
        }

        /* Download list (एक से ज़्यादा फ़ाइलें) */
        .download-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Footer */
        footer {
            background: rgba(4, 12, 26, .7);
            border-top: 1px solid var(--line);
            color: var(--muted);
            padding: 20px;
            text-align: center;
            font-size: 13px;
        }

        footer b {
            color: var(--gold);
            font-weight: 600;
        }

        /* Floating Buttons */
        .float {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 14px;
            z-index: 30;
            display: flex;
            justify-content: space-between;
            padding: 0 14px;
            pointer-events: none;
        }

        .float a {
            pointer-events: auto;
            padding: 12px 18px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 15px;
            color: #fff;
            box-shadow: 0 10px 24px rgba(0, 0, 0, .45);
        }

        .float .call {
            background: var(--navy);
            border: 1.5px solid var(--gold);
            color: var(--gold);
        }

        .float .wa {
            background: #1fb855;
        }

        @media (max-width: 600px) {
            .topbar {
                min-height: 72px;
                padding: 10px 4%;
            }

            .brand {
                font-size: 22px;
            }

            .page-header h1 {
                font-size: 24px;
            }

            .container {
                margin: 22px auto 40px;
                gap: 18px;
            }

            .content-card {
                padding: 18px 14px 20px;
            }

            .download-action {
                flex-direction: column;
                align-items: flex-start;
            }

            .download-btn {
                width: 100%;
                justify-content: center;
                padding: 14px 16px;
                font-size: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- Top Navigation Bar -->
    <header class="topbar">

        <b class="brand">
            जनशक्ति
            <small>एडवोकेट आकाश शुक्ला</small>
        </b>

        <button type="button" class="close-btn"
            onclick="if (history.length > 1) { history.back(); } else { location.href='janshakti_static.html'; }">
            ✕ बंद करें
        </button>

    </header>

    <div class="container">

        <!-- Page Title -->
        <header class="page-header">
            <h1>विस्तृत जानकारी एवं संसाधन</h1>
            <p>वीडियो विवरण, खतौनी और मैप डाउनलोड करें</p>
        </header>

        <!-- 1. YouTube Video Section -->
        <section class="content-card">
            <h2>🎬 परिचय वीडियो</h2>

            <div class="video-wrapper" id="videoWrapper">

                <!-- वीडियो बदलना हो तो /embed/ के बाद की 11 अक्षर की ID बदलें -->
                <iframe
                    src="https://www.youtube.com/embed/5tmjRJr2ZIw"
                    title="जनशक्ति परिचय वीडियो"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
                </iframe>

            </div>
        </section>

        <!-- 2. खतौनी -->
        <section class="content-card">
            <h2>📜 खतौनी</h2>

            <div class="download-list">

                <div class="download-action">
                    <span>खतौनी :</span>
                    <!-- फ़ाइल का सही नाम (extension सहित) यहाँ डालें -->
                    <a href="da" download="खतौनी.pdf" class="download-btn">⬇ डाउनलोड करें</a>
                </div>

                <!-- और खतौनी जोड़नी हो तो ऊपर वाला एक पूरा <div class="download-action"> ... </div>
                     कॉपी करके यहाँ पेस्ट करें और फ़ाइल का नाम बदल दें। -->

            </div>
        </section>

        <!-- 3. मैप -->
        <section class="content-card">
            <h2>🗺️ मैप</h2>

            <div class="download-list">
                <div class="download-action">
                    <span>जमीन का नक्शा अपने डिवाइस में सुरक्षित करें:</span>
                    <a href="indamau map.pdf" download="मैप.pdf" class="download-btn">⬇ नक्शा डाउनलोड करें</a>
                </div>
            </div>
        </section>

    </div>

    <footer>
        <p><b>जनशक्ति</b> • न्याय, अधिकार और जनहित में समर्पित</p>
    </footer>

    <!-- Floating Buttons -->
    <div class="float">
        <a class="call" href="tel:+919598409423">📞 कॉल करें</a>

        <a class="wa" href="https://wa.me/919598409423"
            target="_blank" rel="noopener">
            💬 WhatsApp
        </a>
    </div>

    <script>

        /* VIDEO CHECK */

        (function () {

            var wrapper = document.getElementById('videoWrapper');
            var iframe = wrapper.querySelector('iframe');

            var src = (iframe.getAttribute('src') || '').trim();

            /*
              खाली या गलत YouTube लिंक होने पर
              जल्द उपलब्ध होगा दिखाएँ।
            */

            var validVideo = false;

            try {

                var url = new URL(src);

                var videoId = '';

                if (
                    url.hostname === 'www.youtube.com' ||
                    url.hostname === 'youtube.com' ||
                    url.hostname === 'www.youtube-nocookie.com' ||
                    url.hostname === 'youtube-nocookie.com'
                ) {
                    var match = url.pathname.match(/^\/embed\/([a-zA-Z0-9_-]{11})\/?$/);

                    if (match) {
                        videoId = match[1];
                    }
                }

                validVideo = /^[a-zA-Z0-9_-]{11}$/.test(videoId);

            } catch (error) {
                validVideo = false;
            }

            if (!validVideo) {

                wrapper.innerHTML = `
                    <div class="video-soon">
                        ⏳ जल्द उपलब्ध होगा
                        <small>
                            परिचय वीडियो जल्द ही यहाँ जोड़ा जाएगा।
                        </small>
                    </div>
                `;

            }

        })();


        /* DOWNLOAD BUTTON CHECK */

        function markSoon(btn) {

            btn.classList.add('soon');

            btn.removeAttribute('href');
            btn.removeAttribute('download');

            btn.setAttribute('aria-disabled', 'true');

            btn.textContent = '⏳ जल्द उपलब्ध होगा';

        }


        document.querySelectorAll('.download-btn').forEach(function (btn) {

            var href = (btn.getAttribute('href') || '').trim();

            if (!href || href === '#') {
                markSoon(btn);
                return;
            }

            fetch(href, { method: 'HEAD' })

                .then(function (response) {

                    if (!response.ok) {
                        markSoon(btn);
                    }

                })

                .catch(function () {

                    /*
                      Offline या file:// में
                      फाइल चेक नहीं हो पाएगी।
                    */

                });

        });

    </script>

</body>
</html>
